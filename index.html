<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-flex">
        <div class="main-card-flex">
                <div class="header-flex">
                    <div class="header-card">               
                    <img src="img\icono.png" alt="icono de la aplicacion">
                    <h2>Character Counter</h2>   
                </div>
                <img src="img\icono_de_tema.png" alt="boton de tema">
            </div>
            <div class="tittle-card">
                <h1><span>Analyze your text in real-time.</span></h1>
            </div>        
            <textarea name="textarea" class="textarea" rows="5" >Design is the silent ambassor of your brand. Simplicity is key to effective communication, creating clarity in every interaction. A great design transforms complex ideas into elegant solutions, making them easy to understand. It blends aesthetics and functionality seamlessly.</textarea>
            <div class="checkbox">
                <div class="checkbox-pointer">
                    <label for="exclude spaces" style="cursor: pointer;">
                        <input type="checkbox" name="exclude spaces" id="exclude spaces">
                    Exclude spaces</label>
                    <input type="checkbox" name="set character limit" id="set character limit">
                    <label for="set character limit" style="cursor: pointer;">Set character limit</label>
                </div>   
                <p>Approx. reading time:<1minute </p>
            </div>
            <div class="counter-flexbox">
                <div class="card characters-card"flex-grow="1">
                    <div class="card-num">
                        <p>278</p>
                    </div>
                    <div class="card-text">
                        <p>Total Characters</p>
                    </div>
                </div>
                 <div class="card word-card"flex-grow="1">
                    <div class="card-num">
                        <p>39</p>
                    </div>
                    <div class="card-text">
                        <p>Word Count</p>
                    </div>
                </div>
                 <div class="card sentence-card"flex-grow="1" >
                    <div class="card-num">
                        <p>04</p>
                    </div>
                    <div class="card-text">
                        <p>Sentence Count</p>
                    </div>
                </div>
                
            </div>
            <div class="titulo-letter-density"><h2>Letter Density</h2></div>
            <div class="letter-density">
                    <div class="flex-progress-bar">
                        <p>E</p>
                        <div class="progress-bar">
                            <div class="fillA"></div>
                    </div>
                    <p>40(16.06%)</p>
                    </div>
                   <div class="flex-progress-bar">
                        <p>I</p>
                        <div class="progress-bar">
                            <div class="fillE"></div>
                    </div>
                    <p>29(11.65%)</p>
                    </div>
                    <div class="flex-progress-bar">
                        <p>T</p>
                        <div class="progress-bar">
                            <div class="fillI"></div>
                    </div>
                    <p>28(11.24%)</p>
                    </div>
                   <div class="flex-progress-bar">
                        <p>O</p>
                        <div class="progress-bar">
                            <div class="fillO"></div>
                        </div>
                        <p>22(08.84%)</p>
                    
                    </div>
                    <div class="flex-progress-bar">
                        <p>N</p>
                        <div class="progress-bar">
                            <div class="fillU"></div>
                        
                        </div>
                        <p>21(08.43%)</p>
                    
                    </div>
                
            </div>
        
        
            <p>See more ˅</p>
        </div>

    </div>
    
</body>
</html>
